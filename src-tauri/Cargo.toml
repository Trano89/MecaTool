# Ce crate est volontairement hors de l'espace de travail racine.
#
# `cargo test --workspace` doit rester rapide et sans dependance systeme : la
# compilation de Tauri exige un moteur de rendu web, indisponible sur un
# runner d'integration continue minimal. Le moteur de calcul se teste donc
# seul, et l'application se construit separement.
[workspace]

[package]
name = "mecatool-app"
description = "Application de bureau MecaTool"
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["MecaTool contributors"]

[lib]
name = "mecatool_app_lib"
# `rlib` seul : c'est tout ce dont `main.rs` a besoin pour lier la bibliotheque.
#
# Le modele Tauri ajoute `staticlib` et `cdylib`, destines aux cibles iOS et
# Android. Sur une application de bureau, ils font produire au linker une DLL et
# sa bibliotheque d'import que rien n'utilise — d'ou un avertissement
# `linker_messages` et du temps de compilation perdu. A retablir le jour ou une
# cible mobile sera ajoutee.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mecatool-core = { path = "../crates/mecatool-core" }
mecatool-engine = { path = "../crates/mecatool-engine" }
mecatool-standards = { path = "../crates/mecatool-standards" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
