name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  moteur:
    name: Moteur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace

  donnees:
    name: Validation des donnees normatives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Les tables sont validees au chargement : echelons contigus, monotonie,
      # signes, recoupements croises entre tables saisies separement.
      - name: Invariants des tables
        run: cargo test -p mecatol-standards -- --nocapture
      - name: JSON bien forme
        run: |
          for f in data/**/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
            echo "ok $f"
          done

  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependances systeme de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Les echantillons servent de contrat entre Rust et TypeScript : ils sont
      # regeneres ici, puis `tsc` verifie que les types les decrivent toujours.
      - name: Regenerer les echantillons
        working-directory: src-tauri
        run: cargo test exporte_les_echantillons_pour_typescript
      - name: Les echantillons n'ont pas derive
        run: git diff --exit-code src/fixtures
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
