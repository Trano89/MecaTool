name: Release

# Une release se declenche par un tag « vX.Y.Z », ou a la main en donnant la
# version : le workflow cree alors lui-meme le tag sur le commit lance.
# Windows x64 et macOS Apple Silicon construisent chacun leur paquet
# d'installation et le joignent a la meme release GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publier, par exemple v0.2.0"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release:
    name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      # La version du tag doit etre celle de l'application : une release dont
      # le nom ment sur son contenu serait pire qu'absente.
      - name: La version annoncee est celle du programme
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$expected" ]; then
            echo "Version demandee $VERSION, version du programme $expected" >&2
            exit 1
          fi
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const tag = process.env.VERSION;
            const body = [
              "Voir le journal des modifications (CHANGELOG.md) pour le détail de cette version.",
              "",
              "Paquets : Windows x64 (.msi, .exe) et macOS Apple Silicon (.dmg).",
              "",
              "⚠️ Les domaines états de surface, soudure (hors symboles ISO 2553:2013), visserie et matières",
              "reposent sur des données non encore confrontées à leurs normes. Chaque écran l'affiche avant",
              "toute saisie. Ne pas s'en servir pour réceptionner un ouvrage avant cette confrontation.",
            ].join("\n");
            // Une release creee a la main depuis GitHub, tag compris, est
            // reprise telle quelle : on y joint les paquets sans la doubler.
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              return data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `MecaTool ${tag}`,
              body,
              draft: true,
              prerelease: true,
            });
            return data.id;

  paquet:
    name: Paquet ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}
      - run: npm ci
      # Le moteur est teste avant d'etre empaquete : une release ne part pas
      # d'un etat que l'integration continue refuserait.
      - name: Tests du moteur
        run: cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.target }}

  publier:
    name: Publier la release
    needs: [release, paquet]
    runs-on: ubuntu-latest
    steps:
      # La release reste en brouillon tant que les deux paquets ne sont pas
      # joints : personne ne telecharge une release a moitie construite.
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number("${{ needs.release.outputs.id }}"),
              draft: false,
            });
