name: Release

# Publie une release GitHub, telechargeable par tous, des que la version du
# programme (package.json) n'en a pas encore : il suffit de pousser un commit
# qui change la version. Le workflow cree lui-meme le tag « vX.Y.Z » sur ce
# commit. Il se declenche aussi par un tag pousse a la main, ou depuis l'onglet
# Actions. Windows x64 et macOS Apple Silicon construisent chacun leur paquet
# d'installation et le joignent a la meme release.
on:
  push:
    # La branche de developpement en cours publie aussi : la release n'attend
    # pas la fusion. Elle disparait d'elle-meme une fois la branche fusionnee.
    branches: [master, claude/peaceful-fermi-n4qhib]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # La version publiee est celle du programme : une release dont le nom
      # ment sur son contenu serait pire qu'absente.
      - name: Version du programme
        id: version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME, version du programme $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = process.env.VERSION;
            const { owner, repo } = context.repo;
            // Une release deja publiee pour cette version n'est pas refaite :
            // un commit sans changement de version ne republie rien.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing && !existing.draft) {
              core.notice(`La release ${tag} est deja publiee : rien a faire.`);
              core.setOutput("id", "");
              return;
            }
            // Un brouillon reste d'un run interrompu, ou cree a la main, est
            // repris tel quel : on y joint les paquets sans le doubler.
            if (existing) {
              core.setOutput("id", String(existing.id));
              return;
            }
            const body = [
              "## Télécharger",
              "",
              "| Système | Fichier |",
              "|---|---|",
              "| Windows 10/11 (x64) | `MecaTool_*_x64-setup.exe` (installeur) ou `MecaTool_*_x64_en-US.msi` |",
              "| macOS Apple Silicon (M1 et suivants) | `MecaTool_*_aarch64.dmg` |",
              "",
              "**macOS** : l'application n'est pas signée par un certificat Apple. Au premier lancement,",
              "clic droit sur MecaTool → *Ouvrir*, puis confirmer (ou `xattr -cr /Applications/MecaTool.app`).",
              "",
              "**Windows** : si SmartScreen avertit, *Informations complémentaires* → *Exécuter quand même*.",
              "",
              "## Contenu",
              "",
              "Voir le journal des modifications ([CHANGELOG.md](https://github.com/" + owner + "/" + repo + "/blob/" + tag + "/CHANGELOG.md)).",
              "",
              "⚠️ Les données qui n'ont pas encore été confrontées à leur norme portent l'état « non vérifié ».",
              "Chaque écran l'affiche avant toute saisie : ne pas s'en servir pour réceptionner un ouvrage.",
            ].join("\n");
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `MecaTool ${tag}`,
              body,
              draft: true,
            });
            core.setOutput("id", String(data.id));

  paquet:
    name: Paquet ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}
      - run: npm ci
      # Le moteur est teste avant d'etre empaquete : une release ne part pas
      # d'un etat que l'integration continue refuserait.
      - name: Tests du moteur
        run: cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.target }}

  publier:
    name: Publier la release
    needs: [release, paquet]
    if: needs.release.outputs.id != ''
    runs-on: ubuntu-latest
    steps:
      # La release reste en brouillon tant que les deux paquets ne sont pas
      # joints : personne ne telecharge une release a moitie construite.
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number("${{ needs.release.outputs.id }}"),
              draft: false,
              make_latest: "true",
            });
