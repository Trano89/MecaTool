name: Compilation

# Compile l'application de bureau pour Windows x64 et macOS Apple Silicon, et
# depose les installeurs comme artefacts du run : ils se telechargent depuis
# l'onglet Actions, sans release ni tag.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: compilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            artifact: MecaTool-windows-x64
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: MecaTool-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Compiler et empaqueter
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
