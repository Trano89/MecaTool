[workspace]
resolver = "2"
members = [
    "crates/mecatool-core",
    "crates/mecatool-standards",
    "crates/mecatool-engine",
    "crates/mecatool-cli",
]
exclude = [
    # Voir src-tauri/Cargo.toml : garde les tests du moteur rapides et portables.
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Trano89/MecaTool"
authors = ["MecaTool contributors"]

[workspace.dependencies]
mecatool-core = { path = "crates/mecatool-core", version = "0.1.0" }
mecatool-standards = { path = "crates/mecatool-standards", version = "0.1.0" }
mecatool-engine = { path = "crates/mecatool-engine", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
