<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11"><defs>
<pattern id="hole-hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
<line x1="0" y="0" x2="0" y2="6" stroke="#2563eb" stroke-width="2.5" opacity="0.55"/>
</pattern>
<pattern id="shaft-hatch" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
<line x1="0" y="0" x2="0" y2="6" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
</pattern>
</defs><title>Zones de tolérance Ø20 — 4 ajustements comparés</title><line x1="0" y1="204.36" x2="900" y2="204.36" stroke="#1f2937" stroke-width="1.25"/><text x="2" y="204.36" fill="#1f2937" dy="-5" font-weight="700">0</text><rect x="75.7" y="108.15" width="70.92" height="96.22" fill="url(#hole-hatch)" stroke="#2563eb" stroke-width="1.5"/><text x="111.16" y="100.15" fill="#2563eb" text-anchor="middle" font-weight="700" font-size="11">H7</text><text x="146.62" y="334" fill="#6b7280" text-anchor="middle" font-weight="600" font-size="11">H7/g6</text><rect x="162.38" y="236.44" width="70.92" height="59.56" fill="url(#shaft-hatch)" stroke="#c2410c" stroke-width="1.5"/><text x="197.84" y="228.44" fill="#c2410c" text-anchor="middle" font-weight="700" font-size="11">g6</text><rect x="272.7" y="108.15" width="70.92" height="96.22" fill="url(#hole-hatch)" stroke="#2563eb" stroke-width="1.5"/><text x="308.16" y="100.15" fill="#2563eb" text-anchor="middle" font-weight="700" font-size="11">H7</text><text x="343.62" y="334" fill="#6b7280" text-anchor="middle" font-weight="600" font-size="11">H7/h6</text><rect x="359.38" y="204.36" width="70.92" height="59.56" fill="url(#shaft-hatch)" stroke="#c2410c" stroke-width="1.5"/><text x="394.84" y="196.36" fill="#c2410c" text-anchor="middle" font-weight="700" font-size="11">h6</text><rect x="469.7" y="108.15" width="70.92" height="96.22" fill="url(#hole-hatch)" stroke="#2563eb" stroke-width="1.5"/><text x="505.16" y="100.15" fill="#2563eb" text-anchor="middle" font-weight="700" font-size="11">H7</text><text x="540.62" y="334" fill="#6b7280" text-anchor="middle" font-weight="600" font-size="11">H7/k6</text><rect x="556.38" y="135.64" width="70.92" height="59.56" fill="url(#shaft-hatch)" stroke="#c2410c" stroke-width="1.5"/><text x="591.84" y="127.64" fill="#c2410c" text-anchor="middle" font-weight="700" font-size="11">k6</text><rect x="666.7" y="108.15" width="70.92" height="96.22" fill="url(#hole-hatch)" stroke="#2563eb" stroke-width="1.5"/><text x="702.16" y="100.15" fill="#2563eb" text-anchor="middle" font-weight="700" font-size="11">H7</text><text x="737.62" y="334" fill="#6b7280" text-anchor="middle" font-weight="600" font-size="11">H7/p6</text><rect x="753.38" y="44" width="70.92" height="59.56" fill="url(#shaft-hatch)" stroke="#c2410c" stroke-width="1.5"/><text x="788.84" y="36" fill="#c2410c" text-anchor="middle" font-weight="700" font-size="11">p6</text><text x="0" y="356" fill="#1f2937" font-size="10" font-weight="600">Ligne zéro = dimension nominale Ø20. Zones hachurées : alésage à gauche, arbre à droite.</text><text x="0" y="371" fill="#6b7280" font-size="10">Écarts amplifiés pour la lisibilité : 1 µm = 4.6 px. À cette échelle, le diamètre nominal de</text><text x="0" y="384" fill="#6b7280" font-size="10">20 mm mesurerait environ 24.2 m. Le dessin n'est donc pas à l'échelle de la pièce ; les</text><text x="0" y="397" fill="#6b7280" font-size="10">zones sont en revanche toutes au même rapport entre elles.</text></svg>