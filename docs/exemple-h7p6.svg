<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 414" width="560" height="414" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11"><defs>
<pattern id="hole-hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
<line x1="0" y="0" x2="0" y2="6" stroke="#2563eb" stroke-width="2.5" opacity="0.55"/>
</pattern>
<pattern id="shaft-hatch" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
<line x1="0" y="0" x2="0" y2="6" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
</pattern>
</defs><title>Zones de tolérance Ø20 H7/p6</title><line x1="0" y1="296" x2="560" y2="296" stroke="#1f2937" stroke-width="1.25"/><text x="2" y="296" fill="#1f2937" dy="-5" font-weight="700">0</text><rect x="56" y="144.8" width="130" height="151.2" fill="url(#hole-hatch)" stroke="#2563eb" stroke-width="1.5"/><text x="121" y="122.8" fill="#2563eb" text-anchor="middle" font-weight="700" font-size="13">H7</text><text x="121" y="135.8" fill="#6b7280" text-anchor="middle" font-size="10">IT7 = 21 µm</text><text x="50" y="144.8" fill="#2563eb" dy="-2" text-anchor="end" font-size="10">+21 µm</text><text x="50" y="296" fill="#2563eb" dy="9" text-anchor="end" font-size="10">0</text><rect x="374" y="44" width="130" height="93.6" fill="url(#shaft-hatch)" stroke="#c2410c" stroke-width="1.5"/><text x="439" y="22" fill="#c2410c" text-anchor="middle" font-weight="700" font-size="13">p6</text><text x="439" y="35" fill="#6b7280" text-anchor="middle" font-size="10">IT6 = 13 µm</text><text x="510" y="44" fill="#c2410c" dy="-2" text-anchor="start" font-size="10">+35 µm</text><text x="510" y="137.6" fill="#c2410c" dy="9" text-anchor="start" font-size="10">+22 µm</text><line x1="186" y1="296" x2="249.92" y2="296" stroke="#c2410c" stroke-width="0.6" opacity="0.5"/><line x1="249.92" y1="44" x2="374" y2="44" stroke="#c2410c" stroke-width="0.6" opacity="0.5"/><line x1="249.92" y1="44" x2="249.92" y2="296" stroke="#c2410c" stroke-width="1"/><line x1="246.42" y1="44" x2="253.42" y2="44" stroke="#c2410c" stroke-width="1.4"/><line x1="246.42" y1="296" x2="253.42" y2="296" stroke="#c2410c" stroke-width="1.4"/><text x="249.92" y="44" fill="#c2410c" dy="-6" text-anchor="middle" font-size="10" font-weight="600">serrage 35 µm</text><line x1="186" y1="144.8" x2="321.36" y2="144.8" stroke="#c2410c" stroke-width="0.6" opacity="0.5"/><line x1="321.36" y1="137.6" x2="374" y2="137.6" stroke="#c2410c" stroke-width="0.6" opacity="0.5"/><line x1="321.36" y1="137.6" x2="321.36" y2="144.8" stroke="#c2410c" stroke-width="1"/><line x1="317.86" y1="137.6" x2="324.86" y2="137.6" stroke="#c2410c" stroke-width="1.4"/><line x1="317.86" y1="144.8" x2="324.86" y2="144.8" stroke="#c2410c" stroke-width="1.4"/><text x="321.36" y="137.6" fill="#c2410c" dy="-6" text-anchor="middle" font-size="10" font-weight="600">serrage 1 µm</text><text x="0" y="356" fill="#1f2937" font-size="10" font-weight="600">Ligne zéro = dimension nominale Ø20. Zones hachurées : alésage à gauche, arbre à droite.</text><text x="0" y="371" fill="#6b7280" font-size="10">Écarts amplifiés pour la lisibilité : 1 µm = 7.2 px. À cette échelle, le diamètre nominal de</text><text x="0" y="384" fill="#6b7280" font-size="10">20 mm mesurerait environ 38.1 m. Le dessin n'est donc pas à l'échelle de la pièce ; les deux</text><text x="0" y="397" fill="#6b7280" font-size="10">zones sont en revanche au même rapport l'une que l'autre.</text></svg>